name: APK Olustur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip dosyasini ac
        run: |
          unzip -q *.zip -d _src
          mkdir app
          cp -a _src/*/. app/

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Android klasorunu olustur
        working-directory: app
        run: |
          flutter create . --platforms=android --org com.sansar --project-name gunun_sorusu
          rm -f test/widget_test.dart
          sed -i 's/android:label="[^"]*"/android:label="İlim Yarışı"/' android/app/src/main/AndroidManifest.xml

      - name: Derle
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
